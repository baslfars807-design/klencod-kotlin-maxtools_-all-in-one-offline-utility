name: Build Android Kotlin APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klencod-kotlin-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Generate debug keystore
        shell: bash
        run: |
          if [ -f debug.keystore ]; then
            echo "ℹ️ debug.keystore موجود مسبقاً"
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✅ تم إنشاء debug.keystore"
          fi

      - name: Ensure google-services.json exists
        shell: bash
        run: |
          if [ -f app/google-services.json ]; then
            echo "✅ google-services.json موجود"
          else
            echo "⚠️ إنشاء ملف بديل بـ package_name الصحيح"
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "klencod-placeholder",
              "storage_bucket": "klencod-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.maxtools.wzyr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY00000000000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/klencod-gradle.log"

          if [ -f gradlew ]; then
            echo "✅ Using Gradle Wrapper (gradlew)"
            chmod +x gradlew || true
            ./gradlew --no-daemon --build-cache --parallel \
              :app:assembleDebug -x lint -x test 2>&1 | tee "$LOG"
          else
            echo "⚠️ gradlew غير موجود — استخدام gradle من النظام"
            gradle --no-daemon --build-cache --parallel \
              :app:assembleDebug -x lint -x test 2>&1 | tee "$LOG"
          fi

      - name: Print compiler diagnostics on failure
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/klencod-gradle.log"
          echo "===== Klencod compiler diagnostics ====="
          if [[ -f "$LOG" ]]; then
            grep -E 'error:|warning:|FAILED|Compilation failed|BUILD FAILED|What went wrong|Caused by' "$LOG" | tail -n 150 || true
          else
            echo "Gradle output file was not created."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: klencod-kotlin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7